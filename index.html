<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEAM MIND LEARNING HUB – My Alphabet Adventure</title>
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#2b2a4c;--a:#ff6b6b;--b:#4ecdc4;--c:#ffd166;--d:#6c5ce7;--sand:#f0d9a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d36;--card:#2d2a52;--ink:#fff4d6;--sand:#8a7449}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{height:100%}body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-size:18px}
header{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 12px;margin:4px 8px 0;border-radius:20px;background:linear-gradient(100deg,#5b4bd6,#2a9d9a 65%,#f0a500);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}.logo{flex:none;width:clamp(36px,6vw,52px);height:clamp(36px,6vw,52px);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(22px,4vw,32px);box-shadow:0 2px 0 rgba(0,0,0,.2)}.ht{flex:1;min-width:0}header .hub{color:#fff;font-size:clamp(15px,3.4vw,30px);letter-spacing:.05em;font-weight:800;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.25)}header .hub span:last-child{color:#ffe08a}.sub{font-size:clamp(11px,1.9vw,16px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header #fs{flex:none;margin:0;box-shadow:0 2px 0 rgba(0,0,0,.2);color:#10233a}@media(max-width:420px){.sub{display:none}header{gap:8px;padding:5px 8px}}h1{margin:0;font-size:clamp(16px,3.2vw,28px)}.hub{font-size:clamp(15px,2.8vw,26px);font-weight:800;letter-spacing:.04em;color:var(--d);line-height:1.1}h1{font-size:clamp(13px,2.3vw,19px)!important;font-weight:600}#fs{min-height:36px;padding:4px 12px;font-size:14px;margin-left:8px;background:var(--c)}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:12px 18px;background:var(--b);color:#10233a;font-weight:700;min-height:48px}
button:focus-visible{outline:4px solid var(--d)}nav button.on{background:var(--a);color:#fff}
main{flex:1;min-height:0;overflow:hidden;width:100%;max-width:1100px;margin:0 auto;padding:4px 12px}#fit{transform-origin:top left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.tile{background:var(--card);border-radius:22px;padding:8px;font-size:34px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:28px;padding:18px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.15);margin:10px 0}
.big{font-size:clamp(70px,16vw,130px);font-weight:800;line-height:1;color:var(--a)}.emo{font-size:90px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.opts button{font-size:42px;min-width:90px;background:var(--c)}.opts button.bad{background:#ccc;opacity:.6}
.balloon button{border-radius:50% 50% 45% 45%;min-height:110px;min-width:90px;animation:fl 2.5s ease-in-out infinite alternate}
.balloon button:nth-child(2n){animation-delay:.6s}@keyframes fl{to{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.alphy{font-size:64px}.msg{font-size:24px;min-height:34px;font-weight:700}
canvas{touch-action:none;border-radius:24px;max-width:100%;border:4px dashed var(--a);background:var(--sand)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mem button{height:90px;font-size:36px;background:var(--d);color:#fff}.mem button.f{background:var(--c);color:#10233a}.mem button.m{background:#7bd88f;color:#10233a}
.hl{background:var(--c);color:#10233a;transform:scale(1.25)}
.xs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}.xs button{background:var(--card);color:var(--ink);border:3px solid var(--b);padding:4px 10px;font-size:15px;min-height:0;line-height:1.1}.xs b{display:block;font-size:36px;font-weight:400}
footer{text-align:center;padding:3px 8px;font-size:12px;opacity:.85}@media print{html,body{height:auto;overflow:visible}main{overflow:visible}#fit{transform:none!important;width:100%!important}}
.ws{break-after:page;border:2px solid #888;border-radius:12px;padding:16px;margin:8px 0;text-align:left;background:#fff;color:#000}
@media print{header,nav,footer,.noprint{display:none}body{background:#fff}}
.bar{height:14px;background:rgba(0,0,0,.15);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}
</style></head><body>
<header><div class="logo" aria-hidden="true">🦉</div><div class="ht"><div class="hub" role="heading" aria-level="1"><span>STEAM</span> <span>MIND</span> <span>LEARNING</span> <span>HUB</span></div><div class="sub">🌈 My Alphabet Adventure – Learn A to Z</div></div><button id="fs">⛶ Full screen</button></header>
<nav id="nav"></nav><main id="main"><div id="fit"></div></main>
<footer>Designed by: <b>Govind Bahadur Dhami, AI/ICT Expert</b> · Website: www.govindbdhami.com.np</footer>
<script>
// [letter, word, emoji, IPA sound, spoken sound, Nepali meaning, sentence]
const D=[["a","Apple","🍎","æ","ah","स्याउ","I eat a red apple."],["b","Ball","⚽","b","buh","बल","I kick the ball."],["c","Cat","🐱","k","kuh","बिरालो","The cat drinks milk."],["d","Dog","🐶","d","duh","कुकुर","The dog can run."],["e","Elephant","🐘","e","eh","हात्ती","The elephant is big."],["f","Fish","🐟","f","fff","माछा","The fish can swim."],["g","Goat","🐐","g","guh","बाख्रा","The goat eats grass."],["h","Hen","🐔","h","huh","कुखुरी","The hen has an egg."],["i","Igloo","🧊","ɪ","ih","बरफको घर (igloo)","An igloo is made of ice."],["j","Jug","🏺","dʒ","juh","जग","The jug has water."],["k","Kite","🪁","k","kuh","चंगा","The kite flies high."],["l","Lion","🦁","l","lll","सिंह","The lion is brave."],["m","Mango","🥭","m","mmm","आँप","The mango is sweet."],["n","Nest","🪺","n","nnn","गुँड","A bird is in the nest."],["o","Orange","🍊","ɒ","oh","सुन्तला","I peel an orange."],["p","Parrot","🦜","p","puh","सुगा","The parrot can talk."],["q","Queen","👸","kw","kwuh","रानी","The queen wears a crown."],["r","Rabbit","🐰","r","rrr","खरायो","The rabbit can hop."],["s","Sun","☀️","s","sss","सूर्य","The sun is hot."],["t","Tiger","🐯","t","tuh","बाघ","The tiger has stripes."],["u","Umbrella","☂️","ʌ","uh","छाता","I hold an umbrella."],["v","Van","🚐","v","vvv","भ्यान","The van is white."],["w","Watch","⌚","w","wuh","घडी","I wear a watch."],["x","Xylophone","🎶","ks","ks","जाइलोफोन","I play the xylophone."],["y","Yak","🐂","j","yuh","चौँरी गाई","The yak lives on mountains. (🐂 shows a similar animal)"],["z","Zebra","🦓","z","zzz","जेब्रा","The zebra has stripes."]];
const NAMES="ay,bee,see,dee,ee,eff,gee,aitch,eye,jay,kay,el,em,en,oh,pee,queue,ar,ess,tee,you,vee,double you,ex,why,zed".split(",");
const CVC=[["cat","🐱"],["bat","🦇"],["sun","☀️"],["dog","🐶"],["hen","🐔"],["pig","🐷"]];
const $=s=>document.querySelector(s),M=$("#fit");
let P={stars:0,m:{},b:[],g:{}};try{P=Object.assign(P,JSON.parse(localStorage.getItem("aaP")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("aaP",JSON.stringify(P))}catch(e){}};
const U=i=>D[i][0].toUpperCase(),r=n=>Math.floor(Math.random()*n),pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
let slow=false;
function say(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";const v=speechSynthesis.getVoices().find(v=>/en[-_]GB/i.test(v.lang));if(v)u.voice=v;u.rate=rate||(slow?.5:.8);u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
let ac;function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?660:200;g.gain.value=.1;o.start();o.frequency.setValueAtTime(ok?880:150,ac.currentTime+.12);o.stop(ac.currentTime+.25)}catch(e){}}
const SND={s:"sssss",f:"ffff",m:"mmmm",n:"nnnn",l:"llll",r:"rrrr",v:"vvvv",z:"zzzz"};
const sp=i=>say(SND[D[i][0]]||D[i][4],.6);
const spw=i=>say((SND[D[i][0]]||D[i][4])+". "+D[i][0]+" as in "+D[i][1],.65);
const TIP=["Open mouth wide: æ as in apple","Lips pop, voice on: b (not buh)","Back of tongue taps, voice off: k","Tongue tip taps the ridge, voice on: d","Mouth half open: e as in egg","Top teeth on lip, blow: ffff","Back of tongue taps, voice on: g","Breathe out like fogging glass: h","Small smile, short: ɪ as in igloo","Round lips and push: dʒ as in jug","Same sound as c: k, voice off","Tongue tip up behind teeth: llll","Lips closed, hum: mmmm","Tongue up behind teeth, hum: nnnn","Mouth round and open: ɒ as in orange","Lips pop, voice off: p","Say k and w together: kw","Tongue curls back, no touch: rrrr","Teeth together, hiss: ssss","Tongue taps the ridge, voice off: t","Relaxed and short: ʌ as in umbrella","Top teeth on lip, hum: vvvv","Round lips, then open: w","Say k and s together: ks","Tongue high, glide: j as in yak","Teeth together, buzz: zzzz"];
function badges(){const n=Object.keys(P.m).filter(k=>P.m[k]>=2).length,t=[[P.stars>=1,"⭐ First Letter Learner"],[Object.keys(P.m).length>=10,"🧭 Alphabet Explorer"],[P.stars>=30,"🔊 Sound Superstar"],[(P.g.trace||0)>=3,"✏️ Tracing Champion"],[n>=26,"🏆 Alphabet Master"]];P.b=t.filter(x=>x[0]).map(x=>x[1]);}
function win(i,g){P.stars++;if(i!=null)P.m[D[i][0]]=(P.m[D[i][0]]||0)+1;if(g)P.g[g]=(P.g[g]||0)+1;badges();save()}
const tabs={home:"🏠 Start",letters:"🔤 Letters",games:"🎮 Games",trace:"✋ Sand Trace",songs:"🎵 Song",prog:"⭐ Progress",teach:"👩‍🏫 Teachers"};
function go(t){speechSynthesis&&speechSynthesis.cancel();document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));views[t]();window.scrollTo(0,0)}
$("#nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-t="${k}">${v}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.t)go(e.target.dataset.t)};
const views={
home(){M.innerHTML=`<div class="card"><div class="alphy">🦉</div><div class="msg">Hello, little learner! I am Alphy.</div><p>Let’s learn a new letter!</p><button id="s" style="font-size:30px;background:var(--a);color:#fff">▶ Start Learning</button> <button id="sl">🐢 Slow voice: off</button></div><div class="grid">${D.map((d,i)=>`<button class="tile" data-i="${i}">${U(i)}${d[0]}</button>`).join("")}</div>`;
$("#s").onclick=()=>{say("Hello, little learner! Let's learn a new letter!");go("letters")};
$("#sl").onclick=e=>{slow=!slow;e.target.textContent="🐢 Slow voice: "+(slow?"on":"off")};
M.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{go("letters");card(+b.dataset.i)})},
letters(){M.innerHTML=`<div class="grid">${D.map((d,i)=>`<button class="tile" data-i="${i}">${U(i)}${d[0]}</button>`).join("")}</div><div id="c"></div>`;
M.querySelectorAll(".tile").forEach(b=>b.onclick=()=>card(+b.dataset.i));card(0)},
games(){M.innerHTML=`<div class="card"><div class="msg">Pick a game!</div><div class="opts" id="gl">${Object.keys(G).map(k=>`<button style="font-size:22px" data-k="${k}">${k}</button>`).join("")}</div></div><div id="g"></div>`;
$("#gl").onclick=e=>{if(e.target.dataset.k)G[e.target.dataset.k]()}},
trace(){traceView()},
songs(){M.innerHTML=`<div class="card"><div class="msg">Alphabet Song</div><p>Tap play and say each letter name with Alphy.</p><div class="grid" id="sg">${D.map((d,i)=>`<div class="tile" id="L${i}">${U(i)}</div>`).join("")}</div><p><button id="pl">▶ Play</button> <button id="st">⏸ Pause</button></p></div>`;
let run=0;const sing=async()=>{const id=++run;for(let i=0;i<26&&id==run;i++){document.querySelectorAll(".tile").forEach(t=>t.classList.remove("hl"));$("#L"+i).classList.add("hl");say(NAMES[i],.9);await new Promise(r=>setTimeout(r,1100))}};
$("#pl").onclick=sing;$("#st").onclick=()=>{run++;speechSynthesis.cancel()}},
prog(){badges();const n=Object.keys(P.m).filter(k=>P.m[k]>=2).length;M.innerHTML=`<div class="card"><div class="msg">⭐ ${P.stars} stars</div><p>Letters mastered (2+ correct): ${n} / 26</p><div class="bar"><i style="width:${n/26*100}%"></i></div><p>Badges: ${P.b.length?P.b.join(" · "):"Play a game to win your first badge!"}</p><p>Need practice: ${D.filter(d=>!(P.m[d[0]]>=2)).map(d=>d[0].toUpperCase()).join(" ")||"None!"}</p><button id="rs">Reset progress</button></div>`;
$("#rs").onclick=()=>{if(confirm("Erase all progress?")){P={stars:0,m:{},b:[],g:{}};save();views.prog()}}},
teach(){M.innerHTML=`<div class="card" style="text-align:left"><h2>Parent and teacher corner</h2><p><b>Teaching tips.</b> Teach letter <i>sounds</i> before names, keep consonant sounds short (/s/, not “suh”), and teach short vowel sounds first. British English is the model used. Use sand, clay or rice trays for tracing alongside the screen.</p><p><b>Sounds to note.</b> C /k/ cat, /s/ city. G /g/ goat, /dʒ/ giraffe. S /s/ sun, /z/ rose. Q /kw/ queen. X /ks/ box.</p><p><b>Voice note.</b> The spoken sounds use your device’s speech voice, which adds a vowel to some consonants. Model the exact sounds yourself.</p><button id="pw" class="noprint">🖨 Print worksheets (A–Z)</button></div><div id="w"></div>`;
$("#pw").onclick=()=>{$("#w").innerHTML=D.map((d,i)=>{const o=[d[0],D[(i+7)%26][0],D[(i+13)%26][0]].sort();return`<div class="ws"><h2>${U(i)} ${d[0]} – ${d[1]} ${d[2]}</h2><p>1. Trace uppercase: <span style="font-size:60px;color:#bbb;letter-spacing:12px">${U(i)} ${U(i)} ${U(i)}</span></p><p>2. Trace lowercase: <span style="font-size:60px;color:#bbb;letter-spacing:12px">${d[0]} ${d[0]} ${d[0]}</span></p><p>3. Colour the picture: <span style="font-size:80px;filter:grayscale(1) opacity(.5)">${d[2]}</span> ${d[1]} (${d[5]})</p><p>4. Circle the starting letter of ${d[1]}: <b style="font-size:40px">${o.join("  ")}</b></p><p>5. Match: ${U(i)} ______ ${d[2]}</p></div>`}).join("");window.print()}}};
const EX="Ant 🐜,Ambulance 🚑,Axe 🪓|Bus 🚌,Banana 🍌,Bee 🐝|Cow 🐄,Cake 🍰,City 🏙️|Duck 🦆,Drum 🥁,Door 🚪|Egg 🥚,Envelope ✉️|Frog 🐸,Flower 🌸,Fire 🔥|Grapes 🍇,Gift 🎁,Giraffe 🦒|Horse 🐴,House 🏠,Hat 🎩|Insect 🐛,Ink 🖋️|Juice 🧃,Jacket 🧥,Jeans 👖|Key 🔑,King 🤴,Kangaroo 🦘|Leaf 🍃,Lemon 🍋,Light 💡|Moon 🌙,Monkey 🐒,Milk 🥛|Nose 👃,Nut 🥜,Notebook 📓|Octopus 🐙,Otter 🦦|Pig 🐷,Pencil ✏️,Pizza 🍕|Question ❓,Quill 🪶|Rose 🌹,Rain 🌧️,Rainbow 🌈|Star ⭐,Snake 🐍,Spoon 🥄|Tree 🌳,Train 🚆,Tomato 🍅|Uncle 👨,Up ⬆️|Violin 🎻,Volcano 🌋|Water 💧,Whale 🐳,Watermelon 🍉|X-ray 🩻,Xmas tree 🎄|Yo-yo 🪀,Yarn 🧶,Yellow 🟡|Zero 0️⃣,Zigzag ⚡".split("|").map(s=>s.split(",").map(t=>{const k=t.indexOf(" ",t.lastIndexOf(" ")>0&&/[A-Za-z]$/.test(t.slice(0,t.lastIndexOf(" ")))?t.lastIndexOf(" "):0);const j=t.lastIndexOf(" ");return[t.slice(0,j),t.slice(j+1)]}));
const WORDS=i=>[[D[i][1],D[i][2]],...EX[i]];
function card(i){const d=D[i];$("#c").innerHTML=`<div class="card"><div class="big">${U(i)} ${d[0]}</div><div class="emo">${d[2]}</div><h2>${d[1]}</h2><p>Letter name: <b>${NAMES[i]}</b> · Sound: <b>/${d[3]}/</b> · Nepali: ${d[5]}</p><p>👄 ${TIP[i]}</p><p>“${d[6]}”</p><div class="xs">${WORDS(i).map((w,k)=>`<button data-w="${k}"><b>${w[1]}</b>${w[0]}</button>`).join("")}</div><div class="opts"><button id="n">🔊 Name</button><button id="s">🔊 Sound</button><button id="w">🔊 Word</button><button id="t">🔊 Sentence</button><button id="g">✋ Trace</button></div></div>`;
$("#n").onclick=()=>say(NAMES[i]);$("#s").onclick=()=>spw(i);$("#w").onclick=()=>say(d[1]);$("#t").onclick=()=>say(d[6].replace(/\(.*\)/,""));$("#g").onclick=()=>{go("trace");drawTrace(i)};M.querySelectorAll(".xs button").forEach(b=>b.onclick=()=>say(WORDS(i)[b.dataset.w][0]));say(NAMES[i]);win(i)}
function traceView(){M.innerHTML=`<div class="card"><div class="msg">Trace the single line with your finger or mouse</div><div class="opts" id="tl"></div><canvas id="cv" width="320" height="320"></canvas><p><button id="cl">Clear</button> <button id="ck">Check ✔</button></p><div class="msg" id="tm"></div></div>`;drawTrace(0)}
function drawTrace(i){const lw=document.getElementById("tl");if(!lw){traceView();}let up=true;
$("#tl").innerHTML=`<button id="u">${U(i)}</button><button id="l">${D[i][0]}</button><button id="p">◀</button><button id="x">▶</button>`;
const cv=$("#cv"),x=cv.getContext("2d");let txt=U(i),ink=[],dr=false;
const base=()=>{x.clearRect(0,0,320,320);x.font="bold 260px Arial,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillStyle="rgba(120,90,40,.3)";x.fillText(txt,160,175);x.strokeStyle="rgba(255,255,255,.7)";x.setLineDash([8,8]);x.lineWidth=3;x.strokeText(txt,160,175);x.setLineDash([]);x.strokeStyle="#6c5ce7";x.lineWidth=18;x.lineCap=x.lineJoin="round";ink.forEach(s=>{x.beginPath();s.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()})};
const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*320/b.width,(e.clientY-b.top)*320/b.height]};
cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);ink.push([pt(e)]);base()};cv.onpointermove=e=>{if(dr){ink[ink.length-1].push(pt(e));base()}};cv.onpointerup=()=>dr=false;
base();
$("#u").onclick=()=>{txt=U(i);ink=[];base()};$("#l").onclick=()=>{txt=D[i][0];ink=[];base()};
$("#p").onclick=()=>drawTrace((i+25)%26);$("#x").onclick=()=>drawTrace((i+1)%26);

function quiz(name,gen,cls,N=8){let q=0,s=0;const g=$("#g");const next=()=>{if(q>=N){g.innerHTML=`<div class="card"><div class="alphy">🎉</div><div class="msg">Fantastic! You did it! ${s}/${N}</div><button id="a">Play again</button></div>`;$("#a").onclick=()=>quiz(name,gen,cls,N);say("Fantastic! You did it!");return}
const Q=gen();let tries=0;g.innerHTML=`<div class="card"><div>${name} · ${q+1}/${N} · ⭐ ${s}</div><div class="msg">${Q.p}</div><button id="h">🔊 Listen</button><div class="opts ${cls||""}">${Q.o.map((o,k)=>`<button data-k="${k}">${o[0]}</button>`).join("")}</div><div class="msg" id="f"></div></div>`;
